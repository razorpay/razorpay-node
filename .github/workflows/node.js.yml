# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest  # nosemgrep : semgrep.dev/s/swati31196:github_provided_runner

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    # Start PMG in server mode to block malicious packages at install time
    - uses: safedep/pmg@v1
      with:
        server-mode: true
        api-key: ${{ secrets.SAFEDEP_API_KEY }}
        tenant-id: ${{ secrets.SAFEDEP_TENANT_ID }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: npm run build --if-present
    - run: npm test
    # Enforce PMG policy and flush events
    - name: Stop proxy
      if: always()
      run: pmg proxy stop --fail-on-violation
